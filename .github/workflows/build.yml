name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waff-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager was not found under SDK root: $SDK_ROOT" >&2
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}; ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}" >&2
            exit 1
          fi
          printf 'y\n%.0s' {1..20} | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          if ! gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee /tmp/waff-test.log; then
            grep -E '(^e: |error:|What went wrong:|Execution failed|FAILURE:|Could not|Unresolved reference|failed)' /tmp/waff-test.log | tail -n 40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Compile Android integration tests
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace --console=plain
      - name: Build debug and release APKs
        shell: bash
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain 2>&1 | tee /tmp/waff-build.log; then
            grep -E '(^e: |error:|What went wrong:|Execution failed|FAILURE:|Could not|Unresolved reference|R8:|Missing class|failed)' /tmp/waff-build.log | tail -n 60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Room integration test on Android emulator
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: waff-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-preview-apks:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'arena/b260b5f3-waff' && github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: waff-apks
          path: release-apks
      - name: Publish installable preview APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.0-preview.2"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Preview release $tag already exists; leaving its assets unchanged."
            exit 0
          fi
          debug_apk="$(find release-apks -type f -path '*/debug/*.apk' | head -n 1)"
          unsigned_apk="$(find release-apks -type f -path '*/release/*.apk' | head -n 1)"
          test -n "$debug_apk" && test -n "$unsigned_apk"
          mkdir -p release-assets
          cp "$debug_apk" release-assets/WAFF-${tag}-debug.apk
          cp "$unsigned_apk" release-assets/WAFF-${tag}-release-unsigned.apk
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          gh release create "$tag" release-assets/*.apk release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "WAFF $tag — early preview" \
            --prerelease \
            --notes "Test-only preview APKs for WAFF. This is not a finished or stable app. Direct media downloads, extraction adapters, persistent transfer management, and background audio/video merge are in development; service support and merge playback have not been fully verified on-device. The debug APK is signed with a temporary CI key for evaluation. The release APK is unsigned and requires signing before installation."
