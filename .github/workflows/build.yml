name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager was not found under SDK root: $SDK_ROOT" >&2
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}; ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}" >&2
            exit 1
          fi
          printf 'y\n%.0s' {1..20} | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          if ! gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee /tmp/waff-test.log; then
            grep -E '(^e: |error:|What went wrong:|Execution failed|FAILURE:|Could not|Unresolved reference|failed)' /tmp/waff-test.log | tail -n 40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Build debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: waff-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
